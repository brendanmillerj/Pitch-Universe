[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbpitch"
version = "0.1.0"
description = "Pitch-level MLB ingest and derived pitch geometry, feeding a pitcher-similarity UMAP"
requires-python = ">=3.11"
readme = "README.md"

# Pinned to the versions this pipeline was built and verified against. Loosen
# deliberately rather than by default: pandas 3.x in particular changed enough
# API surface (groupby.apply signatures, categorical concat) that the ingest
# path is version-sensitive.
dependencies = [
    "pyarrow==25.0.0",
    "duckdb==1.5.5",
    "pandas==3.0.1",
    "numpy==2.3.1",
    "requests==2.32.3",
    "tenacity==9.1.4",
]

[project.scripts]
mlbpitch = "mlbpitch.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]
